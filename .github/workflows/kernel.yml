name: kernel

# Builds the patched Talos kernel natively on both architectures and merges
# the results into one multi-arch manifest that `make imager PKG_KERNEL=...`
# can consume.

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Additional tag for the merged manifest (e.g. v1.13.8-rp1pwm)"
        required: false
        default: ""
  push:
    branches:
      - rp1-pwm-1.13

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pkgs derives image tags from `git describe`; a shallow clone
          # produces wrong or missing tags.
          fetch-depth: 0

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build kernel (${{ matrix.arch }})
        run: |
          make kernel \
            PLATFORM=${{ matrix.platform }} \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ steps.owner.outputs.name }} \
            TAG=${{ github.sha }}-${{ matrix.arch }}

      - name: Assert PWM driver is enabled
        if: matrix.arch == 'arm64'
        run: |
          grep -q '^CONFIG_PWM_RASPBERRYPI_RP1=y' kernel/build/config-arm64
          grep -q 'PWM_RASPBERRYPI_RP1' kernel/build/patches/*pwm-rp1*.patch

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kernel"
          EXTRA=""
          if [ -n "${{ inputs.extra_tag }}" ]; then
            EXTRA="-t ${IMG}:${{ inputs.extra_tag }}"
          fi

          docker buildx imagetools create \
            -t "${IMG}:${{ github.sha }}" \
            ${EXTRA} \
            "${IMG}:${{ github.sha }}-amd64" \
            "${IMG}:${{ github.sha }}-arm64"

      - name: Verify both platforms are present
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/kernel"
          docker buildx imagetools inspect "${IMG}:${{ github.sha }}"
