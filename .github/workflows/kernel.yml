name: kernel

# Builds the patched Talos kernel natively on both architectures and merges
# the results into one multi-arch manifest.
#
# Versioning: push a git tag `v<talos-version>-<n>` (e.g. v1.13.9-1) and the
# image is published as ghcr.io/<owner>/kernel:<that tag>. Upstream pkgs tags
# too sparsely to derive a version from, so the Talos version this branch is
# rebased for is used instead.
#
# Release ritual:
#   git rebase --onto <pkgs-commit-talos-pins> <old-base> rp1-pwm-1.13
#   git push --force-with-lease
#   git tag v1.13.9-1 && git push origin v1.13.9-1
#
# The kernel package must be PUBLIC in ghcr — the imager pulls it anonymously.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v1.13.9-1). Required for manual runs."
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Upstream repo and branch this fork tracks. `origin` is the fork, so the
  # upstream remote has to be added explicitly to locate the base commit.
  UPSTREAM_REPO: https://github.com/siderolabs/pkgs.git
  UPSTREAM_BRANCH: release-1.13
  # Must match the symbol declared by the RP1 PWM patch's Kconfig hunk.
  # Guards against the silent-drop failure: syncconfig discards unknown
  # symbols, so a renamed symbol yields a clean build with no driver.
  REQUIRED_SYMBOL: CONFIG_PWM_RASPBERRYPI_RP1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          case "$V" in
            v*) ;;
            *) echo "::error::version must start with v: ${V}"; exit 1 ;;
          esac
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Publishing kernel \`${V}\`" >> "$GITHUB_STEP_SUMMARY"

  preflight:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      pkgs_base: ${{ steps.provenance.outputs.pkgs_base }}
      linux_version: ${{ steps.provenance.outputs.linux_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # These two checks cost seconds and catch the mistake that silently
      # produces a stock kernel: a config symbol that does not match the
      # symbol the patch actually declares.
      - name: Assert patch and config agree
        run: |
          set -euo pipefail
          PATCH=$(ls kernel/build/patches/*pwm-rp1*.patch 2>/dev/null | head -1)
          [ -n "$PATCH" ] || { echo "::error::no pwm-rp1 patch found"; exit 1; }

          grep -q "^${REQUIRED_SYMBOL}=y" kernel/build/config-arm64 \
            || { echo "::error::${REQUIRED_SYMBOL}=y missing from config-arm64"; exit 1; }

          grep -q "${REQUIRED_SYMBOL}" "$PATCH" \
            || { echo "::error::${REQUIRED_SYMBOL} not declared by ${PATCH}"; exit 1; }

          echo "patch:  ${PATCH}"
          echo "symbol: ${REQUIRED_SYMBOL} OK"
          echo "patches present:"
          ls -1 kernel/build/patches/*.patch

      - name: Determine provenance
        id: provenance
        run: |
          set -euo pipefail

          # origin is the fork; upstream must be added to resolve the base.
          git remote add upstream "${UPSTREAM_REPO}" 2>/dev/null || true
          git fetch upstream --tags --quiet "${UPSTREAM_BRANCH}"

          MERGE_BASE=$(git merge-base HEAD "upstream/${UPSTREAM_BRANCH}")
          # --always falls back to a bare SHA when no tag is an ancestor;
          # upstream pkgs tags sparsely, so that is a real possibility.
          BASE=$(git describe --tags --always --abbrev=12 "${MERGE_BASE}")
          LINUX=$(grep '^  linux_version:' Pkgfile | awk '{print $2}')

          echo "pkgs_base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "linux_version=${LINUX}" >> "$GITHUB_OUTPUT"

          {
            echo "| key | value |"
            echo "|---|---|"
            echo "| version | \`${{ needs.version.outputs.version }}\` |"
            echo "| pkgs base | \`${BASE}\` |"
            echo "| merge-base | \`${MERGE_BASE}\` |"
            echo "| linux | \`${LINUX}\` |"
            echo "| patches | \`$(ls -1 kernel/build/patches/*.patch | wc -l)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [version, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pkgs derives image tags from `git describe`; a shallow clone
          # produces wrong or missing tags.
          fetch-depth: 0

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-arch tags: both jobs push to distinct references, then the merge
      # job joins them. Pushing both to one tag would race.
      - name: Build kernel (${{ matrix.arch }})
        run: |
          make kernel \
            PLATFORM=${{ matrix.platform }} \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ needs.version.outputs.owner }} \
            TAG=${{ needs.version.outputs.version }}-${{ matrix.arch }}

  merge:
    needs: [version, preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Provenance is computed once in preflight and passed through, so this
      # job needs no checkout and cannot disagree with the earlier summary.
      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/kernel"
          V="${{ needs.version.outputs.version }}"

          docker buildx imagetools create \
            -t "${IMG}:${V}" \
            --annotation "index:dev.hoefling.pkgs-base=${{ needs.preflight.outputs.pkgs_base }}" \
            --annotation "index:dev.hoefling.linux-version=${{ needs.preflight.outputs.linux_version }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            "${IMG}:${V}-amd64" \
            "${IMG}:${V}-arm64"

          docker buildx imagetools inspect "${IMG}:${V}"

      - name: Verify both platforms and the config symbol
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@latest
          export PATH="$PATH:$(go env GOPATH)/bin"

          IMG="${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/kernel:${{ needs.version.outputs.version }}"

          PLATFORMS=$(crane manifest "$IMG" | jq -r '.manifests[].platform.architecture' | sort | tr '\n' ' ')
          echo "platforms: ${PLATFORMS}"
          case "$PLATFORMS" in
            *amd64*arm64*) ;;
            *) echo "::error::manifest is not multi-arch: ${PLATFORMS}"; exit 1 ;;
          esac

          # Read the config out of the shipped arm64 kernel. This is the only
          # check that proves the driver was actually compiled in, rather than
          # that the inputs looked right.
          ARM="${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/kernel:${{ needs.version.outputs.version }}-arm64"
          VMLINUZ=$(crane export "$ARM" - | tar t | grep -E 'vmlinuz|/Image$' | head -1)
          [ -n "$VMLINUZ" ] || { echo "::error::no kernel artifact found in ${ARM}"; exit 1; }
          echo "kernel artifact: ${VMLINUZ}"
          crane export "$ARM" - | tar xO "$VMLINUZ" > /tmp/vmlinuz

          curl -sO https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig
          chmod +x extract-ikconfig
          ./extract-ikconfig /tmp/vmlinuz | grep "^${REQUIRED_SYMBOL}=y" \
            || { echo "::error::${REQUIRED_SYMBOL} not set in the built kernel"; exit 1; }

          {
            echo "### Published"
            echo ""
            echo "\`${IMG}\`"
            echo ""
            echo "- platforms: \`${PLATFORMS}\`"
            echo "- pkgs base: \`${{ needs.preflight.outputs.pkgs_base }}\`"
            echo "- linux: \`${{ needs.preflight.outputs.linux_version }}\`"
            echo "- \`${REQUIRED_SYMBOL}=y\` confirmed in the built kernel"
          } >> "$GITHUB_STEP_SUMMARY"
